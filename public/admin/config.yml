backend:
  name: github
  repo: SkornF/fate
  branch: main
  base_url: https://sveltia-cms-auth.joepohl7.workers.dev

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "events"
    label: "Events"
    files:
      - name: "events"
        label: "Upcoming Events"
        file: "src/data/events.json"
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            summary: "{{title}} — {{fields.start}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - {
                  label: "Starts",
                  name: "start",
                  widget: "datetime",
                  format: "YYYY-MM-DDTHH:mm",
                  date_format: "YYYY-MM-DD",
                  time_format: "HH:mm",
                  picker_utc: false,
                  hint: "When the ride/event starts.",
                }
              - {
                  label: "Ends (optional)",
                  name: "end",
                  widget: "datetime",
                  format: "YYYY-MM-DDTHH:mm",
                  date_format: "YYYY-MM-DD",
                  time_format: "HH:mm",
                  picker_utc: false,
                  required: false,
                  hint: "Leave blank for a single start time with no set end. Use a later date here for multi-day events.",
                }
              - {
                  label: "Location Name",
                  name: "location",
                  widget: "string",
                  hint: "e.g. Croom Motorcycle Area, Brooksville, FL",
                }
              - {
                  label: "Map Link (optional)",
                  name: "mapUrl",
                  widget: "string",
                  required: false,
                  hint: "Paste a Google Maps link (open the location in Google Maps, click Share, copy link). Leave blank and the site will auto-search the Location Name instead.",
                }
              - {
                  label: "Description",
                  name: "description",
                  widget: "text",
                  required: false,
                }
              - {
                  label: "Link (optional)",
                  name: "link",
                  widget: "string",
                  required: false,
                  hint: "e.g. a link to the Facebook event.",
                }

  - name: "site"
    label: "Site Content"
    files:
      - name: "settings"
        label: "General Settings"
        file: "src/data/site.json"
        fields:
          - {
              label: "Hero Top Banner Text",
              name: "heroLabel",
              widget: "string",
              hint: "Small orange label above the F.A.T.E. title, e.g. \"Florida Off-Road Riding\"",
            }
          - {
              label: "Member Count Blurb (hero text)",
              name: "memberCountText",
              widget: "string",
            }
          - {
              label: "Hero Subheading",
              name: "heroSubheading",
              widget: "string",
            }
          - {
              label: "About Headline",
              name: "aboutHeadline",
              widget: "string",
            }
          - { label: "About Body", name: "aboutBody", widget: "text" }
          - {
              label: "Facebook Group URL",
              name: "facebookGroupUrl",
              widget: "string",
            }
          - {
              label: "Stat 1 Value",
              name: "stat1Value",
              widget: "string",
              hint: "e.g. \"9,000+\"",
            }
          - {
              label: "Stat 1 Label",
              name: "stat1Label",
              widget: "string",
              hint: "e.g. \"Riders in the group\"",
            }
          - {
              label: "Stat 2 Value",
              name: "stat2Value",
              widget: "string",
              hint: "e.g. \"100%\"",
            }
          - {
              label: "Stat 2 Label",
              name: "stat2Label",
              widget: "string",
              hint: "e.g. \"Grassroots & rider-run\"",
            }
          - {
              label: "Stat 3 Value",
              name: "stat3Value",
              widget: "string",
              hint: "e.g. \"10+\"",
            }
          - {
              label: "Stat 3 Label",
              name: "stat3Label",
              widget: "string",
              hint: "e.g. \"Off-road riding locations\"",
            }
          - {
              label: "Hero Background Photo (optional)",
              name: "heroImage",
              widget: "image",
              required: false,
              hint: "Wide trail/ride photo shown behind the hero text, with a dark overlay. Leave blank to just use the plain background.",
            }

  - name: "gallery"
    label: "Gallery"
    files:
      - name: "gallery"
        label: "Photo Gallery"
        file: "src/data/gallery.json"
        fields:
          - label: "Photos"
            name: "images"
            widget: "list"
            summary: "{{caption}}"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - {
                  label: "Caption (optional)",
                  name: "caption",
                  widget: "string",
                  required: false,
                }

  - name: "riding-areas"
    label: "Riding Areas"
    files:
      - name: "riding-areas"
        label: "Riding Areas"
        file: "src/data/riding-areas.json"
        fields:
          - label: "Areas"
            name: "areas"
            widget: "list"
            summary: "{{name}}"
            fields:
              - {
                  label: "Name",
                  name: "name",
                  widget: "string",
                  hint: "e.g. Ocala National Forest",
                }
              - {
                  label: "Type (optional)",
                  name: "type",
                  widget: "string",
                  required: false,
                  hint: "e.g. National Forest, WMA, State Forest",
                }
              - {
                  label: "Region",
                  name: "region",
                  widget: "string",
                  hint: "e.g. Ocala, FL",
                }
              - {
                  label: "Description",
                  name: "description",
                  widget: "text",
                  hint: "Trail conditions, permit/pass requirements, difficulty, anything riders should know before heading out.",
                }
              - {
                  label: "Map Link (optional)",
                  name: "mapUrl",
                  widget: "string",
                  required: false,
                  hint: "Paste a Google Maps link. Leave blank and the site will auto-search the Name + Region instead.",
                }
              - {
                  label: "More Info Link (optional)",
                  name: "moreInfoUrl",
                  widget: "string",
                  required: false,
                  hint: "Official site with permit/trail info, e.g. the Forest Service or FWC page.",
                }
              - {
                  label: "Photo (optional)",
                  name: "image",
                  widget: "image",
                  required: false,
                }
