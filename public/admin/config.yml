backend:
  name: github
  repo: SkornF/fate
  branch: dev
  base_url: https://sveltia-cms-auth.joepohl7.workers.dev

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "events"
    label: "Events"
    files:
      - name: "events"
        label: "Upcoming Events"
        file: "src/data/events.json"
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            summary: "{{title}} — {{fields.start}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - {
                  label: "Starts",
                  name: "start",
                  widget: "datetime",
                  format: "YYYY-MM-DDTHH:mm",
                  date_format: "YYYY-MM-DD",
                  time_format: "HH:mm",
                  picker_utc: false,
                  hint: "When the ride/event starts.",
                }
              - {
                  label: "Ends (optional)",
                  name: "end",
                  widget: "datetime",
                  format: "YYYY-MM-DDTHH:mm",
                  date_format: "YYYY-MM-DD",
                  time_format: "HH:mm",
                  picker_utc: false,
                  required: false,
                  hint: "Leave blank for a single start time with no set end. Use a later date here for multi-day events.",
                }
              - {
                  label: "Location Name",
                  name: "location",
                  widget: "string",
                  hint: "e.g. Croom Motorcycle Area, Brooksville, FL",
                }
              - {
                  label: "Map Link (optional)",
                  name: "mapUrl",
                  widget: "string",
                  required: false,
                  hint: "Paste a Google Maps link (open the location in Google Maps, click Share, copy link). Leave blank and the site will auto-search the Location Name instead.",
                }
              - {
                  label: "Description",
                  name: "description",
                  widget: "text",
                  required: false,
                }
              - {
                  label: "Link (optional)",
                  name: "link",
                  widget: "string",
                  required: false,
                  hint: "e.g. a link to the Facebook event.",
                }

  - name: "site"
    label: "Site Content"
    files:
      - name: "settings"
        label: "General Settings"
        file: "src/data/site.json"
        fields:
          - {
              label: "Member Count Blurb (hero text)",
              name: "memberCountText",
              widget: "string",
            }
          - {
              label: "Hero Subheading",
              name: "heroSubheading",
              widget: "string",
            }
          - {
              label: "About Headline",
              name: "aboutHeadline",
              widget: "string",
            }
          - { label: "About Body", name: "aboutBody", widget: "text" }
          - {
              label: "Facebook Group URL",
              name: "facebookGroupUrl",
              widget: "string",
            }
